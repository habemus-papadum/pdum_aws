[project]
name = "habemus-papadum-aws"
version = "0.6.1+dev"
description = "AWS utils"
readme = "README.md"
license = { file = "LICENSE" }
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

authors = [
    { name = "Nehal Patel", email = "nehal@alum.mit.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.15",
]

[project.scripts]
pdum-aws = "pdum.aws.cli:main"
pdx = "pdum.aws.cli.pdx:main"

[project.urls]
Homepage = "https://github.com/habemus-papadum/pdum_aws"
Repository = "https://github.com/habemus-papadum/pdum_aws"
Documentation = "https://github.com/habemus-papadum/pdum_aws"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdum"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.26.1",
    "mkdocstrings-python>=1.11.1",
    "mkdocs-jupyter>=0.25.1",
    "jupyter>=1.1.1",
    "rich>=13.7.1",
    "pre-commit>=3.7.0",
    "watchdog>=3.0.0",
    "habemus-papadum-ship>=0.1.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/pdum/aws"]
relative_files = true
omit = [
    "*/tests/*",
    "*/testing.py",
]

# ship releases this package: one version per package, the tag is the truth,
# the manifest carries <last release>+dev between releases. See the README.
[tool.ship]
ours = ["habemus-papadum-*", "@habemus-papadum/*"]
shared-paths = [".github/workflows/**"]
